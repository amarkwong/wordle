<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Wordle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="score-panel" aria-label="Score">
      <p class="score-label">Score</p>
      <p class="score-total" id="score-total">0</p>
      <div class="score-meta">
        <span>Last</span>
        <strong id="last-score">0</strong>
      </div>
      <div class="score-meta">
        <span>Wins</span>
        <strong id="rounds-won">0</strong>
      </div>
    </aside>

    <main class="app" aria-labelledby="game-title">
      <header class="topbar">
        <div>
          <p class="eyebrow">Custom word list</p>
          <h1 id="game-title">Wordle</h1>
        </div>
        <div class="topbar-actions">
          <span class="timer" id="timer" role="timer" aria-live="off" hidden>10s</span>
          <label class="hard-toggle" title="Hard mode: 10 seconds per guess">
            <input type="checkbox" id="hard-toggle" />
            <span>Hard</span>
          </label>
          <button class="icon-button" id="new-game" type="button" aria-label="Start new game" title="New game">
            ↻
          </button>
        </div>
      </header>

      <section class="status" id="status" role="status" aria-live="polite">
        Guess the 5-letter word in 6 tries.
      </section>

      <section class="meme-feedback" id="meme-feedback" aria-live="polite" hidden>
        <img id="meme-image" alt="" />
      </section>

      <section class="board" id="board" aria-label="Wordle guesses"></section>

      <aside class="debug-panel" id="debug-panel" hidden>
        <div class="debug-heading">
          <h2>Word List</h2>
          <span id="word-count"></span>
        </div>
        <div class="word-list" id="word-list" aria-label="Debug word list"></div>
      </aside>

      <section class="keyboard" id="keyboard" aria-label="Keyboard"></section>
    </main>

    <div class="modal-backdrop" id="congrats-modal" hidden>
      <section
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="congrats-title"
        aria-describedby="congrats-message"
        tabindex="-1"
      >
        <img
          class="success-asset"
          src="assets/party-captain.gif"
          alt=""
          aria-hidden="true"
        />
        <p class="modal-eyebrow">Round complete</p>
        <h2 id="congrats-title">You win</h2>
        <p id="congrats-message"></p>
        <div class="modal-actions">
          <button class="secondary-button" id="stay-round" type="button">Stay here</button>
          <button class="primary-button" id="next-round" type="button">Play next word</button>
        </div>
      </section>
    </div>

    <script src="words.js"></script>
    <script src="script.js"></script>
  </body>
</html>
